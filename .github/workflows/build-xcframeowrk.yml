name: Build Pomme Core XCFramework

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-xcframework:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies for shaderc
        run: brew install cmake ninja pkg-config

      - name: Install Rust Toolchain & Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
          override: true

      - name: Ensure Target is Registered
        run: rustup target add aarch64-apple-ios

      - name: Install cbindgen
        run: cargo install cbindgen

      - name: Build Rust Static Library (iOS Target)
        run: |
          cargo build --lib --package pomme-client --target aarch64-apple-ios --no-default-features --release

      - name: Create cbindgen Configuration
        run: |
          cat << 'EOF' > cbindgen.toml
          language = "C"
          include_guard = "POMME_CORE_H"
          EOF

      - name: Generate C Header
        run: |
          cbindgen --config cbindgen.toml --crate pomme-client --output pomme.h

      - name: Prepare Headers & Module Map
        run: |
          rm -rf Headers
          mkdir -p Headers
          cp pomme.h Headers/
          cat << 'EOF' > Headers/module.modulemap
          module PommeCore {
              header "pomme.h"
              export *
          }
          EOF

      - name: Assemble XCFramework
        run: |
          rm -rf build
          mkdir -p build
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libpomme_client.a \
            -headers Headers \
            -output build/PommeCore.xcframework

      - name: Compress XCFramework
        run: |
          cd build
          zip -r ../PommeCore.xcframework.zip PommeCore.xcframework
          cd ..
          echo "FRAMEWORK_SHA=$(shasum -a 256 PommeCore.xcframework.zip | awk '{ print $1 }')" >> $GITHUB_ENV

      - name: Display Release Info
        run: |
          echo "SHA256 Checksum for Swift Package Manager:"
          echo "${{ env.FRAMEWORK_SHA }}"

      - name: Upload Release Artifact
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: PommeCore.xcframework.zip
          body: |
            Pomme Core XCFramework Build
            
            **SPM binaryTarget checksum:**
            `${{ env.FRAMEWORK_SHA }}`
