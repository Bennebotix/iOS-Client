name: Build Pomme Core XCFramework

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-xcframework:
    runs-on: xcode-27
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies for shaderc
        run: brew install cmake ninja pkg-config

      - name: Install Rust Toolchain & Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
          override: true

      - name: Ensure Target is Registered
        run: rustup target add aarch64-apple-ios

      - name: Install cbindgen
        run: cargo install cbindgen

      - name: Ensure lib.rs and ffi.rs Exist
        run: |
          mkdir -p pomme-client/src
          if [ ! -f pomme-client/src/lib.rs ]; then
            echo 'pub mod ffi;' > pomme-client/src/lib.rs
            echo 'pub use ffi::*;' >> pomme-client/src/lib.rs
          fi
          if [ ! -f pomme-client/src/ffi.rs ]; then
            cat << 'EOF' > pomme-client/src/ffi.rs
          use std::ffi::{CStr, CString};
          use std::os::raw::{c_char, c_void};
          use std::sync::atomic::{AtomicBool, Ordering};

          pub struct PommeInstance {
              pub is_running: AtomicBool,
              pub layer_ptr: *mut c_void,
          }

          #[no_mangle]
          pub unsafe extern "C" fn pomme_init(metal_layer: *mut c_void) -> *mut PommeInstance {
              if metal_layer.is_null() {
                  return std::ptr::null_mut();
              }
              let instance = Box::new(PommeInstance {
                  is_running: AtomicBool::new(true),
                  layer_ptr: metal_layer,
              });
              Box::into_raw(instance)
          }

          #[no_mangle]
          pub unsafe extern "C" fn pomme_connect_server(
              instance: *mut PommeInstance,
              address: *const c_char,
              port: u16,
          ) -> bool {
              if instance.is_null() || address.is_null() {
                  return false;
              }
              true
          }

          #[no_mangle]
          pub unsafe extern "C" fn pomme_render_frame(instance: *mut PommeInstance) {
              if instance.is_null() {
                  return;
              }
          }

          #[no_mangle]
          pub unsafe extern "C" fn pomme_destroy(instance: *mut PommeInstance) {
              if instance.is_null() {
                  return;
              }
              let instance = Box::from_raw(instance);
              instance.is_running.store(false, Ordering::Relaxed);
          }
          EOF
          fi

      - name: Build Rust Static Library (iOS Target)
        run: |
          cargo build --package pomme-client --target aarch64-apple-ios --no-default-features --release

      - name: Create cbindgen Configuration
        run: |
          cat << 'EOF' > cbindgen.toml
          language = "C"
          include_guard = "POMME_CORE_H"
          EOF

      - name: Generate C Header
        run: |
          cbindgen --config cbindgen.toml --crate pomme-client --output pomme.h

      - name: Prepare Module Map
        run: |
          mkdir -p Headers
          cp pomme.h Headers/
          cat << 'EOF' > Headers/module.modulemap
          module PommeCore {
              header "pomme.h"
              export *
          }
          EOF

      - name: Assemble XCFramework
        run: |
          mkdir -p build
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libpomme_client.a \
            -headers Headers \
            -output build/PommeCore.xcframework

      - name: Compress XCFramework
        run: |
          cd build
          zip -r ../PommeCore.xcframework.zip PommeCore.xcframework
          cd ..
          echo "FRAMEWORK_SHA=$(shasum -a 256 PommeCore.xcframework.zip | awk '{ print $1 }')" >> $GITHUB_ENV

      - name: Display Release Info
        run: |
          echo "SHA256 Checksum for Swift Package Manager:"
          echo "${{ env.FRAMEWORK_SHA }}"

      - name: Upload Release Artifact
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: PommeCore.xcframework.zip
          body: |
            Pomme Core XCFramework Build
            
            **SPM binaryTarget checksum:**
            `${{ env.FRAMEWORK_SHA }}`
