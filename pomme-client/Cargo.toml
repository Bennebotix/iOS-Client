[package]
name = "pomme-client"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
name = "pomme_client"
path = "src/lib.rs"
crate-type = ["staticlib", "rlib"]

[features]
default = []
singleplayer = ["dep:pomme-singleplayer"]
ttf-fonts = ["dep:freetype-rs"]

[build-dependencies]
shaderc = "0.10"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
directories = { workspace = true }
sha1_smol = { workspace = true }
open = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
rsa = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
regex = { workspace = true }
zip = { workspace = true }
tokio = { workspace = true, features = ["tracing", "net", "time"] }
reqwest = { workspace = true, features = ["blocking"] }
pyronyx = { workspace = true, features = ["rwh_06"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

tracing-appender = "0.2"
mimalloc = "0.1"
pomme-gpu-allocator = { path = "../pomme-gpu-allocator" }
pomme-protocol = { path = "../pomme-protocol" }
pomme-singleplayer = { path = "../pomme-singleplayer", optional = true }
winit = { version = "0.30", features = ["rwh_06"] }
raw-window-handle = "0.6"
glam = { workspace = true }
clap = { version = "4", features = ["derive"] }
parking_lot = "0.12"
bytemuck = { version = "1", features = ["derive"] }
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
flate2 = "1"
azalea-buf = "0.16"
azalea-protocol = { version = "0.16", default-features = false }
azalea-crypto = "0.16"
azalea-auth = "0.16"
azalea-entity = "0.16"
azalea-world = "0.16"
azalea-block = "0.16"
azalea-chat = "0.16"
azalea-core = "0.16"
azalea-registry = "0.16"
azalea-inventory = "0.16"
uuid = { version = "1", features = ["v4"] }
md-5 = "0.11"
crossbeam-channel = "0.5"
png = "0.17"
image = "0.25"
fontdue = "0.9.3"
freetype-rs = { version = "0.38", optional = true }
simdnbt = "0.10"
scopeguard = "1.2"
libloading = "0.9"
symphonia = { version = "0.5.5", default-features = false, features = ["ogg", "vorbis"] }
fastrand = "2"

[target.'cfg(not(target_os = "ios"))'.dependencies]
discord-rich-presence = "1.1"
arboard = { version = "3", features = ["wayland-data-control"] }
gilrs = "0.11.2"
